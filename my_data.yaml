# 这里的路径一定要写对！
# 将 `path` 设置为数据集根目录（相对于工程根目录）
path: NEU-DET  # 数据集存放的根目录（相对于仓库的 `datasets` 目录）
train: images/train       # 训练集图片相对于 path 的位置
val: images/val           # 验证集图片相对于 path 的位置
# test: images/test       # 测试集（可选）

# 类别信息（NEU-DET 常见的 6 类缺陷）
names:
  0: crazing
  1: inclusion
  2: patches
  3: pitted_surface
  4: rolled-in-scale
  5: scratches